<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Acesso ao Sistema</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="flex min-h-screen items-center justify-center bg-slate-100 px-4">
    <div class="w-full max-w-md rounded-2xl bg-white p-8 shadow-lg">
        <div class="mb-8 text-center">
            <p class="text-sm uppercase tracking-[0.3em] text-sky-600">Gestao de TI</p>
            <h1 class="mt-2 text-2xl font-semibold text-slate-900">Entrar</h1>
            <p class="mt-2 text-sm text-slate-500">Use um usuario Django para acessar o painel interno.</p>
        </div>

        <form method="post" class="space-y-4">
            {% csrf_token %}
            {% for field in form %}
                <div>
                    <label for="{{ field.id_for_label }}" class="block text-sm font-medium text-slate-700">{{ field.label }}</label>
                    <div class="mt-1">{{ field }}</div>
                    {% if field.errors %}
                        <p class="mt-1 text-sm text-rose-600">{{ field.errors|join:", " }}</p>
                    {% endif %}
                </div>
            {% endfor %}

            {% if form.non_field_errors %}
                <div class="rounded-lg border border-rose-200 bg-rose-50 px-4 py-3 text-sm text-rose-700">
                    {{ form.non_field_errors|join:", " }}
                </div>
            {% endif %}

            <button type="submit" class="w-full rounded-lg bg-slate-900 px-4 py-3 text-sm font-medium text-white">
                Acessar
            </button>
        </form>
    </div>
</body>
</html>
